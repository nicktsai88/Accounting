<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f472b6">
    <meta name="application-name" content="Accounting">
    <title>🌸 Accounting｜囍事快剪結賬紀錄表 ✨</title>
    <style>
        :root {
            --navy: #8f4668;
            --navy-2: #a85a7a;
            --ink: #684052;
            --muted: #9b7486;
            --canvas: #fff7fa;
            --surface: #ffffff;
            --line: #f1d6e0;
            --soft: #fff4f8;
            --amber: #e99ab4;
            --amber-soft: #fff0f5;
            --teal: #c96b92;
            --teal-soft: #faedf3;
            --red: #e11d48;
            --red-soft: #fff1f2;
            --green: #16825f;
            --green-soft: #e5f5ef;
            --shadow: 0 18px 50px rgba(143, 70, 104, .12);
            --shadow-sm: 0 8px 24px rgba(168, 90, 122, .09);
            --radius: 22px;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--canvas); }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-size: 17px;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 3%, rgba(236, 166, 187, .16), transparent 25rem),
                radial-gradient(circle at 93% 8%, rgba(225, 166, 194, .15), transparent 28rem),
                radial-gradient(circle at 50% 100%, rgba(242, 190, 204, .14), transparent 32rem),
                linear-gradient(145deg, #fffafc 0%, #fceef4 52%, #fff7fa 100%);
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        button, input { font: inherit; }
        button { color: inherit; }
        button:focus-visible, input:focus-visible {
            outline: 3px solid rgba(217, 154, 43, .35);
            outline-offset: 3px;
        }
        .hidden { display: none !important; }
        .app { min-height: 100dvh; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 74px;
            padding: 12px max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
            color: #fff;
            background: linear-gradient(120deg, rgba(143, 70, 104, .96), rgba(199, 108, 147, .95), rgba(225, 139, 164, .95));
            border-bottom: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(16px);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-logo-card { display: grid; place-items: center; flex: 0 0 auto; padding: 5px 9px; border-radius: 13px; background: rgba(255,255,255,.94); box-shadow: 0 8px 22px rgba(157,23,77,.18); }
        .brand-logo { display: block; width: 132px; height: 34px; object-fit: contain; }
        .brand-copy { min-width: 0; }
        .brand-name { font-weight: 900; letter-spacing: .04em; font-size: 18px; }
        .brand-page { margin-top: 2px; color: #fff5f8; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        .connection-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 34px;
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255,255,255,.10);
            color: #eaf0f4;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }
        .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #efb84e; box-shadow: 0 0 0 4px rgba(239,184,78,.12); }
        .connection-badge.online .connection-dot { background: #5dd2ad; box-shadow: 0 0 0 4px rgba(93,210,173,.12); }
        .connection-badge.offline .connection-dot { background: #f28a8a; box-shadow: 0 0 0 4px rgba(242,138,138,.12); }
        .connection-badge.saving .connection-dot { animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: .35; transform: scale(.78); } }

        .icon-button, .secondary-button, .primary-button, .ghost-button {
            border: 0;
            cursor: pointer;
            min-height: 44px;
            border-radius: 13px;
            font-weight: 900;
            font-size: 16px;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .icon-button:hover, .secondary-button:hover, .primary-button:hover, .ghost-button:hover { transform: translateY(-1px); }
        .icon-button { display: inline-grid; place-items: center; width: 44px; padding: 0; background: rgba(255,255,255,.11); color: #fff; }
        .ghost-button { padding: 0 16px; background: rgba(255,255,255,.11); color: #fff; }
        .primary-button { padding: 0 22px; background: linear-gradient(135deg, #d989a5, #cf79a0); color: #fff; box-shadow: 0 8px 20px rgba(168,90,122,.22); }
        .secondary-button { padding: 0 18px; background: var(--soft); color: var(--navy); }

        .page {
            width: min(1440px, 100%);
            margin: 0 auto;
            padding: 34px 26px calc(54px + env(safe-area-inset-bottom));
        }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .eyebrow { margin: 0 0 7px; color: var(--teal); font-weight: 900; font-size: 14px; letter-spacing: .13em; text-transform: uppercase; }
        h1, h2, h3, p { margin-top: 0; }
        h1 { margin-bottom: 9px; color: var(--navy); font-size: clamp(30px, 4vw, 46px); line-height: 1.2; letter-spacing: -.025em; }
        .lead { margin-bottom: 0; color: var(--muted); font-size: 17px; line-height: 1.7; }

        .login-page {
            min-height: 100dvh;
            display: grid;
            grid-template-columns: minmax(320px, .85fr) minmax(560px, 1.15fr);
        }
        .login-intro {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100%;
            padding: clamp(34px, 7vw, 82px);
            color: #fff;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 10%, rgba(255,255,255,.28), transparent 16rem),
                radial-gradient(circle at 95% 88%, rgba(255,228,236,.35), transparent 24rem),
                linear-gradient(145deg, #a95f80 0%, #cb7a9d 48%, #e391aa 100%);
        }
        .login-brand { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; }
        .login-brand .brand-logo-card { padding: 7px 12px; border-radius: 16px; }
        .login-brand .brand-logo { width: min(250px, 34vw); height: 54px; }
        .login-copy { position: relative; z-index: 2; max-width: 580px; padding: 68px 0; }
        .login-copy .eyebrow { color: #fff0a8; }
        .login-copy h1 { max-width: 11em; color: #fff; font-size: clamp(42px, 6vw, 70px); }
        .login-copy p { max-width: 36em; color: #fff4f8; font-size: 19px; line-height: 1.8; }
        .login-note { position: relative; z-index: 2; color: #ffe6ef; font-size: 14px; line-height: 1.7; }
        .hero-logo-card { width: min(470px, 100%); margin: 0 auto 34px; padding: 16px 22px; border: 2px solid rgba(255,255,255,.62); border-radius: 24px; background: rgba(255,255,255,.95); box-shadow: 0 20px 50px rgba(122,20,64,.22); transform: none; }
        .hero-logo-card img { display: block; width: 100%; height: auto; }
        .emoji-ribbon { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; font-size: 25px; filter: drop-shadow(0 4px 7px rgba(122,20,64,.2)); }
        .sakura-sprinkles { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .sakura-sprinkles span { position: absolute; opacity: .32; filter: drop-shadow(0 5px 8px rgba(122,20,64,.18)); }
        .sakura-sprinkles span:nth-child(1) { left: 7%; top: 18%; font-size: 34px; transform: rotate(-14deg); }
        .sakura-sprinkles span:nth-child(2) { right: 9%; top: 12%; font-size: 46px; transform: rotate(18deg); }
        .sakura-sprinkles span:nth-child(3) { left: 17%; bottom: 12%; font-size: 54px; transform: rotate(12deg); }
        .sakura-sprinkles span:nth-child(4) { right: 13%; bottom: 24%; font-size: 30px; transform: rotate(-18deg); }
        .sakura-sprinkles span:nth-child(5) { left: 45%; top: 4%; font-size: 26px; }
        .login-select {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(30px, 6vw, 78px);
        }
        .login-select-inner { width: min(670px, 100%); margin: auto; }
        .login-select h2 { margin-bottom: 8px; color: var(--navy); font-size: clamp(32px, 4vw, 46px); }
        .profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 30px; }
        .profile-card {
            position: relative;
            min-height: 260px;
            overflow: hidden;
            padding: 28px;
            text-align: left;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(255,255,255,.86);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        .profile-card::after { content: "🌸"; position: absolute; display: grid; place-items: center; width: 160px; height: 160px; right: -72px; bottom: -70px; border-radius: 50%; background: var(--profile-soft); font-size: 54px; }
        .profile-card:hover { transform: translateY(-5px); border-color: var(--profile); box-shadow: var(--shadow); }
        .profile-avatar {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            margin-bottom: 34px;
            border-radius: 26px;
            color: #fff;
            background: linear-gradient(145deg, var(--profile), #dda0b6);
            font-size: 34px;
            font-weight: 900;
            box-shadow: 0 12px 24px color-mix(in srgb, var(--profile) 26%, transparent);
        }
        .profile-card h3 { position: relative; z-index: 1; margin-bottom: 7px; color: var(--navy); font-size: 29px; }
        .profile-meta { position: relative; z-index: 1; color: var(--muted); font-size: 16px; font-weight: 700; }
        .profile-enter { position: absolute; z-index: 2; right: 24px; top: 26px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--profile); background: var(--profile-soft); font-size: 20px; }
        .admin-login-button { width: 100%; margin-top: 18px; padding: 16px 18px; border: 1px solid #eab8cb; border-radius: 16px; color: var(--navy); background: linear-gradient(135deg, #fff, #fff1f6); box-shadow: var(--shadow-sm); cursor: pointer; font-size: 17px; font-weight: 900; }
        .admin-login-button:hover { border-color: var(--amber); transform: translateY(-1px); }
        .login-status { margin-top: 24px; display: flex; justify-content: center; }
        .login-status .connection-badge { background: #fff; color: var(--muted); border: 1px solid var(--line); }

        .year-control { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: var(--shadow-sm); }
        .year-control button { width: 46px; height: 46px; border: 0; border-radius: 11px; background: var(--soft); color: var(--navy); cursor: pointer; font-size: 21px; }
        .year-value { min-width: 110px; text-align: center; color: var(--navy); font-size: 23px; font-weight: 900; }

        .month-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
        .month-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.93); box-shadow: var(--shadow-sm); }
        .month-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 15px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #fffafc, #fbedf3); }
        .month-card-header h2 { margin: 0; color: var(--navy); font-size: 23px; }
        .month-count { padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 13px; font-weight: 900; }
        .slot-list { display: grid; gap: 9px; padding: 14px; }
        .slot-shell { position: relative; }
        .closing-slot {
            width: 100%;
            min-height: 72px;
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) auto;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            text-align: left;
            border: 1px dashed #f4aac7;
            border-radius: 15px;
            background: #fbfcfc;
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease, transform .18s ease;
        }
        .closing-slot:hover { transform: translateY(-1px); border-color: var(--teal); background: #fff3f7; }
        .closing-slot.has-date { padding-right: 48px; border-style: solid; border-color: #f5b6cf; background: linear-gradient(135deg, #fff1f6, var(--teal-soft)); }
        .slot-number { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: var(--navy); background: var(--soft); font-size: 17px; font-weight: 900; }
        .has-date .slot-number { color: #fff; background: var(--teal); }
        .slot-copy { min-width: 0; }
        .slot-title { display: block; color: var(--navy); font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-subtitle { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 700; }
        .slot-arrow { color: var(--teal); font-size: 20px; }
        .date-edit {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            color: var(--teal);
            background: rgba(255,255,255,.72);
            cursor: pointer;
        }

        .summary-banner {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding: 18px 20px;
            border: 1px solid #f6bed2;
            border-radius: var(--radius);
            background: linear-gradient(135deg, #fff8fb, #ffe4ee, var(--teal-soft));
        }
        .back-button { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--navy); font-size: 16px; font-weight: 900; cursor: pointer; }
        .closing-date { color: var(--navy); font-size: 23px; font-weight: 900; }
        .closing-context { margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 700; }
        .progress-pill { min-width: 120px; padding: 11px 14px; text-align: center; border-radius: 13px; background: #fff; color: var(--teal); font-size: 14px; font-weight: 900; box-shadow: var(--shadow-sm); }
        .formula-note { margin: 0 0 18px; padding: 13px 17px; border-left: 4px solid var(--amber); border-radius: 0 12px 12px 0; background: var(--amber-soft); color: #7c3659; font-size: 15px; font-weight: 800; line-height: 1.7; }

        .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
        .summary-table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
        .summary-table th { position: sticky; top: 0; z-index: 2; width: 9.666%; padding: 16px 7px; color: #fff; background: linear-gradient(135deg, #a75b7c, #c87499); font-size: 16px; letter-spacing: 0; line-height: 1.4; text-align: center; white-space: normal; }
        .summary-table th:first-child { left: 0; z-index: 4; width: 13%; text-align: left; }
        .summary-table td { height: 70px; padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
        .summary-table tbody tr:last-child td { border-bottom: 0; }
        .summary-table tbody tr:hover td { background: #fff5f8; }
        .summary-table td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; text-align: left; }
        .branch-cell { display: flex; align-items: center; gap: 10px; }
        .branch-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 6px 12px 6px 7px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            color: var(--navy);
            cursor: pointer;
            font-size: 17px;
            font-weight: 900;
            transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
        }
        .branch-button:hover { transform: translateY(-1px); border-color: var(--amber); box-shadow: var(--shadow-sm); }
        .store-icon { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border: 2px solid #ffc4d9; border-radius: 13px; background: linear-gradient(145deg, #fffafc, #ffe4ee); overflow: hidden; box-shadow: 0 5px 12px rgba(236,72,153,.16); font-size: 23px; }
        .store-icon::before { content: "💈"; filter: drop-shadow(0 2px 3px rgba(190,24,93,.15)); }
        .store-icon::after { content: none; }
        .branch-status { color: var(--teal); font-size: 13px; }
        .locked-cell { color: #7c3659; background: #fffafd; cursor: not-allowed; user-select: none; }
        .locked-cell.empty { color: #b5bfc5; font-weight: 600; }
        .diff-positive { color: var(--green) !important; background: var(--green-soft) !important; box-shadow: inset 0 0 0 2px #6ee7a3, inset 0 0 20px rgba(34,197,94,.28); text-shadow: 0 0 9px rgba(34,197,94,.38); }
        .diff-negative { color: var(--red) !important; background: var(--red-soft) !important; box-shadow: inset 0 0 0 2px #ff7a9e, inset 0 0 20px rgba(244,63,94,.3); text-shadow: 0 0 9px rgba(244,63,94,.38); }
        .status-cell { text-align: center !important; }
        .checkout-alert { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 9px; border: 2px solid #ff4d7d; border-radius: 10px; color: #e11d48; background: #fff0f4; box-shadow: 0 0 14px rgba(255,45,101,.5), inset 0 0 12px rgba(255,77,125,.16); text-shadow: 0 0 8px rgba(225,29,72,.42); font-size: 14px; font-weight: 900; white-space: nowrap; }
        .total-row td { position: sticky; bottom: 0; z-index: 1; color: var(--navy); background: #ffe8f0 !important; border-top: 2px solid #f3b5cd; border-bottom: 0; font-weight: 900; }
        .total-row td:first-child { z-index: 3; }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(14, 30, 43, .58);
            backdrop-filter: blur(8px);
        }
        .modal-card { width: min(560px, 100%); max-height: min(90dvh, 860px); overflow: auto; border-radius: 26px; background: #fff; box-shadow: 0 30px 90px rgba(9,25,37,.32); }
        .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 24px 24px 17px; border-bottom: 1px solid var(--line); }
        .modal-header h2 { margin-bottom: 6px; color: var(--navy); font-size: 27px; }
        .modal-header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
        .modal-close { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 0; border-radius: 12px; background: var(--soft); color: var(--navy); cursor: pointer; font-size: 22px; }
        .modal-body { padding: 22px 24px 8px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px 24px; }
        .field { margin-bottom: 17px; }
        .field label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--navy); font-size: 15px; font-weight: 900; }
        .field-note { color: var(--muted); font-size: 13px; font-weight: 700; }
        .field input { width: 100%; min-height: 56px; padding: 13px 14px; border: 1px solid #efb5cd; border-radius: 13px; background: #fff; color: var(--ink); font-size: 20px; font-weight: 800; }
        .field input:focus { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(217,154,43,.12); outline: 0; }
        .field-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
        .field-title-row > label { margin: 0; }
        .checkout-toggle { display: inline-flex !important; align-items: center; justify-content: flex-start !important; gap: 8px !important; margin: 0 !important; padding: 8px 11px; border: 1px solid #ffb4ca; border-radius: 11px; color: #c72f5a !important; background: #fff2f6; cursor: pointer; white-space: nowrap; }
        .checkout-toggle input { appearance: auto; width: 20px !important; height: 20px; min-height: 20px !important; flex: 0 0 20px; margin: 0; padding: 0 !important; border: 0 !important; border-radius: 4px; box-shadow: none !important; accent-color: #e11d48; cursor: pointer; }
        .checkout-toggle span { font-size: 15px; font-weight: 900; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { appearance: none; margin: 0; }
        input[type="number"] { appearance: textfield; }
        .money-input { position: relative; }
        .money-input::before { content: "NT$"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; font-weight: 900; pointer-events: none; }
        .money-input input { padding-left: 52px; text-align: right; font-variant-numeric: tabular-nums; }
        .expense-list { display: grid; gap: 12px; margin: 4px 0 18px; }
        .expense-card { padding: 15px; border: 1px solid #f0cad9; border-radius: 16px; background: #fff8fb; }
        .expense-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; color: var(--navy); font-size: 16px; font-weight: 900; }
        .expense-optional { color: var(--muted); font-size: 13px; font-weight: 700; }
        .expense-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(150px, .75fr); gap: 12px; }
        .expense-grid .field { margin-bottom: 0; }
        .expense-grid .field label { font-size: 14px; }
        .expense-grid .field input { min-height: 52px; font-size: 17px; }
        .calculation-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; padding: 14px; border-radius: 16px; background: var(--soft); }

</head>
<body>
    <main id="app" class="app"></main>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module">
        // 所有資料與雲端路徑統一使用 Accounting 命名空間。
        const APP_NAMESPACE = 'Accounting';
        const COLLECTION_NAME = 'Accounting';
        const PROFILE_COLLECTION = 'Accounting_profiles';
        const STORAGE_PREFIX = 'Accounting';
        const INITIAL_YEAR = 2026;
        const AUTH_EMAILS = {
            Nick: 'nick@xishihaircut.internal',
            '小雯': 'xiaowen@xishihaircut.internal',
            '彩屏': 'caiping@xishihaircut.internal'
        };

        const firebaseConfig = {
            apiKey: "AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",
            authDomain: "chinese-learning-47f4d.firebaseapp.com",
            projectId: "chinese-learning-47f4d",
            storageBucket: "chinese-learning-47f4d.firebasestorage.app",
            messagingSenderId: "76289812052",
            appId: "1:76289812052:web:898384a916f9f341f62fc1"
        };

        const profiles = {
            '小雯': {
                color: '#c66f96', soft: '#faedf3', emoji: '🌷',
                branches: ['陽明', '大昌', '建興', '後昌', '左營', '明誠', '華榮', '光遠', '大社', '內惟', '一心', '五甲', '瑞隆', '德惠']
            },
            '彩屏': {
                color: '#d9879f', soft: '#fff0f4', emoji: '🌈',
                branches: ['自由', '福山', '大寮', '復興', '鼎中', '十全', '華夏', '武廟', '小港']
            }
        };

        let username = '';
        let userData = emptyUserData('');
        let currentView = 'login';
        let currentYear = INITIAL_YEAR;
        let currentSelection = null;
        let connectionStatus = 'loading';
        let cloud = null;
        let unsubscribeProfile = null;
        let branchDirty = false;
        let toastTimer = null;
        let authState = { uid: '', role: '', profile: '' };
        let adminUsers = [];

        const $ = (selector, root = document) => root.querySelector(selector);
        const app = $('#app');
        const modalRoot = $('#modal-root');

        function emptyUserData(name) {
            return { collectionName: COLLECTION_NAME, profile: name, records: {}, updatedAt: '' };
        }

        function normalizeUserData(raw, name) {
            const safe = raw && typeof raw === 'object' ? raw : {};
            return {
                collectionName: COLLECTION_NAME,
                profile: name,
                records: safe.records && typeof safe.records === 'object' ? safe.records : {},
                updatedAt: typeof safe.updatedAt === 'string' ? safe.updatedAt : ''
            };
        }

        function storageKey(name) { return `${STORAGE_PREFIX}:profile:${name}`; }

        function loadLocalData(name) {
            try {
                const raw = localStorage.getItem(storageKey(name));
                userData = normalizeUserData(raw ? JSON.parse(raw) : null, name);
            } catch (_) {
                userData = emptyUserData(name);
            }
        }

        function saveLocalData() {
            if (!username) return;
            try { localStorage.setItem(storageKey(username), JSON.stringify(userData)); } catch (_) {}
        }

        function getRecord(year, month, slot, create = false) {
            const y = String(year), m = String(month), s = String(slot);
            if (!userData.records[y]) {
                if (!create) return null;
                userData.records[y] = {};
            }
            if (!userData.records[y][m]) {
                if (!create) return null;
                userData.records[y][m] = {};
            }
            if (!userData.records[y][m][s]) {
                if (!create) return null;
                userData.records[y][m][s] = { date: '', branches: {}, updatedAt: '' };
            }
            const record = userData.records[y][m][s];
            if (!record.branches || typeof record.branches !== 'object') record.branches = {};
            return record;
        }

        function amount(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function pettyAmounts(data) {
            const hasSplitExpenses = ['petty1', 'petty2', 'petty3'].some((key) => data && Object.prototype.hasOwnProperty.call(data, key));
            return hasSplitExpenses
                ? [amount(data?.petty1), amount(data?.petty2), amount(data?.petty3)]
                : [amount(data?.petty), 0, 0];
        }

        function pettyInputValues(data) {
            const hasSplitExpenses = ['petty1', 'petty2', 'petty3'].some((key) => data && Object.prototype.hasOwnProperty.call(data, key));
            return hasSplitExpenses
                ? [data?.petty1 ?? '', data?.petty2 ?? '', data?.petty3 ?? '']
                : [data?.petty ?? '', '', ''];
        }

        function pettyTotal(data) {
            return pettyAmounts(data).reduce((total, value) => total + value, 0);
        }

        function escapeAttribute(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function pettyItemSummary(data) {
            return [1, 2, 3]
                .map((index) => String(data?.[`pettyItem${index}`] || '').trim())
                .filter(Boolean)
                .join('、');
        }

        function branchCalculation(data) {
            const cashTotal = amount(data?.bills) + amount(data?.coins) + amount(data?.coinTransfer);
            const petty = pettyTotal(data);
            const actualIncome = cashTotal + petty;
            const diff = actualIncome - amount(data?.ticket);
            return { cashTotal, pettyTotal: petty, actualIncome, diff };
        }

        function money(value) {
            return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 }).format(amount(value));
        }

        function moneyCell(value, saved) { return saved ? `NT$ ${money(value)}` : '—'; }

        function formatDate(dateString, full = false) {
            if (!dateString) return '';
            const date = new Date(`${dateString}T12:00:00`);
            return new Intl.DateTimeFormat('zh-TW', full
                ? { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }
                : { month: 'numeric', day: 'numeric', weekday: 'short' }
            ).format(date);
        }

        function isoNow() { return new Date().toISOString(); }
        function lastDayOfMonth(year, month) { return new Date(year, month, 0).getDate(); }
        function pad(number) { return String(number).padStart(2, '0'); }

        function connectionMeta() {
            if (connectionStatus === 'online') return { text: '☁️ 雲端已同步 ✨', className: 'online' };
            if (connectionStatus === 'saving') return { text: '💾 正在儲存...', className: 'saving' };
            if (connectionStatus === 'offline') return { text: '📱 離線儲存', className: 'offline' };
            return { text: '🌸 連線中...', className: 'saving' };
        }

        function connectionBadge() {
            const state = connectionMeta();
            return `<span class="connection-badge ${state.className}"><span class="connection-dot"></span><span class="connection-text">${state.text}</span></span>`;
        }

        function updateConnectionBadges() {
            const state = connectionMeta();
            document.querySelectorAll('.connection-badge').forEach((badge) => {
                badge.className = `connection-badge ${state.className}`;
                const text = $('.connection-text', badge);
                if (text) text.textContent = state.text;
            });
        }

        function topbar(pageName) {
            return `
                <header class="topbar">
                    <div class="brand">
                        <div class="brand-logo-card"><img class="brand-logo" src="assets/logo.png" alt="囍事快剪"></div>
                        <div class="brand-copy">
                            <div class="brand-name">🌸 Accounting</div>
                            <div class="brand-page">${pageName} · ${username}</div>
                        </div>
                    </div>
                    <div class="topbar-actions">
                        ${connectionBadge()}
                        ${authState.role === 'admin' && username !== 'Nick' ? '<button class="ghost-button" type="button" onclick="renderAdmin()">🛡️ 管理後台</button>' : ''}
                        <button class="ghost-button" type="button" onclick="logout()">👋 切換使用者</button>
                    </div>
                </header>`;
        }

        function showToast(message) {
            const toast = $('#toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function renderLogin() {
            currentView = 'login';
            app.innerHTML = `
                <section class="login-page">
                    <div class="login-intro">
                        <div class="sakura-sprinkles" aria-hidden="true"><span>🌸</span><span>🌺</span><span>✨</span></div>
                        <div class="login-brand">
                            <div><strong>Accounting</strong><br><span style="color:#fff3f7;font-size:14px">Weekly closing records</span></div>
                        </div>
                        <div class="login-copy">
                            <div class="hero-logo-card"><img src="assets/logo.png" alt="囍事快剪 Logo"></div>
                            <p class="eyebrow">🌸 結賬紀錄表</p>
                            <h1>每週結賬，清楚又可愛！</h1>
                            <p>💗 選擇你的帳號，依日期進入當週統計表。日期、分店金額與差額都會分開保存。</p>
                            <div class="emoji-ribbon" aria-hidden="true">🌸 ✂️ 💖 💰 ✨</div>
                        </div>
                        <div class="login-note">☁️ 資料優先儲存於本機；連上網路後會同步至 Accounting 雲端資料區。</div>
                    </div>
                    <div class="login-select">
                        <div class="login-select-inner">
                            <p class="eyebrow">🌷 快速登入</p>
                            <h2>今天由誰結賬？</h2>
                            <p class="lead">點選專屬圖示，進入各自的日期表與分店清單。</p>
                            <div class="profile-grid">
                                ${Object.entries(profiles).map(([name, profile]) => `
                                    <button class="profile-card" style="--profile:${profile.color};--profile-soft:${profile.soft}" type="button" onclick="openAuthDialog('${name}')" aria-label="以${name}身分登入">
                                        <span class="profile-enter" aria-hidden="true">🚀</span>
                                        <span class="profile-avatar" aria-hidden="true">${profile.emoji}</span>
                                        <h3>${name}</h3>
                                        <span class="profile-meta">${profile.branches.length} 間分店 · 點我進入</span>
                                    </button>`).join('')}
                            </div>
                            <button class="admin-login-button" type="button" onclick="openAuthDialog('Nick')">🔐 Nick 管理者登入</button>
                            <div class="login-status">${connectionBadge()}</div>
                        </div>
                    </div>
                </section>`;
        }

        function renderCalendar() {
            currentView = 'calendar';
            const monthCards = Array.from({ length: 12 }, (_, index) => {
                const month = index + 1;
                const slots = Array.from({ length: 5 }, (_, slotIndex) => {
                    const slot = slotIndex + 1;
                    const record = getRecord(currentYear, month, slot);
                    const branchCount = record ? Object.values(record.branches || {}).filter((item) => item?.saved).length : 0;
                    if (record?.date) {
                        return `
                            <div class="slot-shell">
                                <button class="closing-slot has-date" type="button" onclick="openSummary(${currentYear},${month},${slot})">
                                    <span class="slot-number">${slot}</span>
                                    <span class="slot-copy">
                                        <span class="slot-title">📅 ${formatDate(record.date)}</span>
                                        <span class="slot-subtitle">已完成 ${branchCount}/${profiles[username].branches.length} 間分店</span>
                                    </span>
                                </button>
                                <button class="date-edit" type="button" title="修改日期" aria-label="修改第 ${slot} 次結賬日期" onclick="event.stopPropagation();openDateDialog(${currentYear},${month},${slot})">✏️</button>
                            </div>`;
                    }
                    return `
                        <button class="closing-slot" type="button" onclick="openDateDialog(${currentYear},${month},${slot})">
                            <span class="slot-number">${slot}</span>
                            <span class="slot-copy">
                                <span class="slot-title">🗓️ 設定結賬日期</span>
                                <span class="slot-subtitle">第 ${slot} 次結賬</span>
                            </span>
                            <span class="slot-arrow" aria-hidden="true">＋</span>
                        </button>`;
                }).join('');
                const setCount = Array.from({ length: 5 }, (_, i) => getRecord(currentYear, month, i + 1)?.date).filter(Boolean).length;
                return `
                    <section class="month-card">
                        <div class="month-card-header"><h2>🌸 ${month} 月</h2><span class="month-count">${setCount}/5 已設定</span></div>
                        <div class="slot-list">${slots}</div>
                    </section>`;
            }).join('');

            app.innerHTML = `
                ${topbar('📅 日期表')}
                <div class="page">
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">${username}的結賬紀錄</p>
                            <h1>📅 選擇結賬日期</h1>
                            <p class="lead">每月最多 5 次。空白格先設定日期，已有日期的格子可直接進入統計表。</p>
                        </div>
                        <div class="year-control" aria-label="年份選擇">
                            <button type="button" onclick="changeYear(-1)" aria-label="上一年">⬅️</button>
                            <span class="year-value">${currentYear}</span>
                            <button type="button" onclick="changeYear(1)" aria-label="下一年">➡️</button>
                        </div>
                    </div>
                    <div class="month-grid">${monthCards}</div>
                </div>`;
        }

        function renderSummary() {
            currentView = 'summary';
            const { year, month, slot } = currentSelection;
            const record = getRecord(year, month, slot);
            if (!record?.date) { renderCalendar(); return; }
            const branches = profiles[username].branches;
            const savedCount = branches.filter((branch) => record.branches?.[branch]?.saved).length;
            const totals = { ticket: 0, bills: 0, coins: 0, coinTransfer: 0, cashTotal: 0, petty: 0, actualIncome: 0, diff: 0, cannotCheckout: 0 };

            const rows = branches.map((branch) => {
                const data = record.branches?.[branch] || {};
                const saved = Boolean(data.saved);
                const calc = branchCalculation(data);
                if (saved) {
                    totals.bills += amount(data.bills);
                    totals.coins += amount(data.coins);
                    totals.coinTransfer += amount(data.coinTransfer);
                    totals.ticket += amount(data.ticket);
                    totals.cashTotal += calc.cashTotal;
                    totals.petty += calc.pettyTotal;
                    totals.actualIncome += calc.actualIncome;
                    totals.diff += calc.diff;
                    if (data.cannotCheckout) totals.cannotCheckout += 1;
                }
                const diffClass = !saved ? 'empty' : calc.diff > 0 ? 'diff-positive' : calc.diff < 0 ? 'diff-negative' : '';
                return `
                    <tr>
                        <td>
                            <div class="branch-cell">
                                <button class="branch-button" type="button" onclick="openBranchEditor('${branch}')" aria-label="輸入${branch}分店金額">
                                    <span class="store-icon" aria-hidden="true"></span>
                                    <span>${branch}</span>
                                    <span class="branch-status">${saved ? '已填' : '待填'}</span>
                                </button>
                            </div>
                        </td>
                        <td class="locked-cell ${saved ? '' : 'empty'}" aria-disabled="true">${moneyCell(data.ticket, saved)}</td>
                        <td class="locked-cell ${saved ? '' : 'empty'}" aria-disabled="true">${moneyCell(data.bills, saved)}</td>

        function enterProfile(name) {

        window.logout = async function() {
            if (unsubscribeProfile) unsubscribeProfile();
            unsubscribeProfile = null;
            if (cloud?.auth && cloud?.authApi) {
                try { await cloud.authApi.signOut(cloud.auth); } catch (_) {}
            }
            username = '';
            authState = { uid: '', role: '', profile: '' };
            userData = emptyUserData('');
            currentSelection = null;
            closeModal(true);
            renderLogin();

        function authErrorMessage(error) {
            const code = String(error?.code || '');
            if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return '登入名稱或密碼不正確。';
            if (code.includes('too-many-requests')) return '嘗試次數過多，請稍後再試。';
            if (code.includes('network-request-failed')) return '網路連線失敗，請確認網路後再試。';
            if (code.includes('permission-denied')) return '此帳號沒有執行這項操作的權限。';
            if (code.includes('failed-precondition')) return error?.message || '目前無法完成設定，請聯絡 Nick。';
            return error?.message || '操作失敗，請稍後再試。';
        }

        function setAuthMessage(message) {
            const element = $('#auth-message');
            if (element) element.textContent = message || '';
        }

        async function callBackend(name, data = {}) {
            if (!cloud?.functions || !cloud?.functionsApi) throw new Error('雲端管理服務尚未連線。');
            const callable = cloud.functionsApi.httpsCallable(cloud.functions, name);
            const result = await callable(data);
            return result.data;
        }

        window.openAuthDialog = function(name, mode = 'login') {

            modalRoot.innerHTML = `

                            <div><h2 id="auth-dialog-title">${isSetup ? '首次設定登入密碼' : '帳號登入'}</h2><p>密碼由 Firebase 安全驗證，不會儲存在網頁原始碼。</p></div>
                            <button class="modal-close" type="button" onclick="closeModal(true)" aria-label="關閉">×</button>

                                ${isSetup ? `
                                    <div class="field"><label for="activation-code">首次啟用碼</label><input id="activation-code" type="text" inputmode="text" autocomplete="one-time-code" maxlength="24" required placeholder="請輸入 Nick 提供的啟用碼"></div>
                                    <div class="field"><label for="auth-password">設定登入密碼</label><input id="auth-password" type="password" autocomplete="new-password" value="" data-lpignore="true" data-1p-ignore minlength="8" required placeholder="至少 8 個字元"></div>
                                    <div class="field"><label for="auth-password-confirm">再次輸入密碼</label><input id="auth-password-confirm" type="password" autocomplete="new-password" value="" data-lpignore="true" data-1p-ignore minlength="8" required placeholder="再次輸入相同密碼"></div>
                                    <p class="password-guidance">請使用本人記得住、其他人猜不到的密碼；完成後啟用碼會立即失效。</p>` : `
                                    <div class="field"><label for="auth-password">登入密碼</label><input id="auth-password" type="password" autocomplete="off" value="" data-lpignore="true" data-1p-ignore required placeholder="請輸入密碼"></div>`}
                                <p id="auth-message" class="auth-message" role="alert"></p>
                                ${name !== 'Nick' ? `<button class="auth-switch" type="button" onclick="openAuthDialog('${name}','${isSetup ? 'login' : 'setup'}')">${isSetup ? '已有密碼？返回登入' : '第一次使用？設定登入密碼'}</button>` : ''}

                        </form>
                    </section>
                </div>`;

                if (isSetup) $('#activation-code')?.focus();

        async function finishAuthenticatedLogin(user, requestedName) {
            const token = await user.getIdTokenResult(true);
            const isAdmin = token.claims.admin === true || token.claims.role === 'admin';
            const profile = String(token.claims.profile || '');
            if (requestedName === 'Nick' && !isAdmin) throw new Error('此帳號沒有管理者權限。');
            if (requestedName !== 'Nick' && profile !== requestedName && !isAdmin) throw new Error('帳號身分與所選使用者不符。');
            authState = { uid: user.uid, role: isAdmin ? 'admin' : 'staff', profile: isAdmin ? 'Nick' : profile };
            closeModal(true);
            if (isAdmin && requestedName === 'Nick') renderAdmin();
            else enterProfile(requestedName);
        }

        window.submitPasswordLogin = async function(event, name) {
            event.preventDefault();
            const button = $('#auth-submit');
            if (button) button.disabled = true;
            setAuthMessage('');
            try {
                if (!cloud?.auth || !cloud?.authApi) throw new Error('雲端登入服務尚未連線。');
                const password = $('#auth-password')?.value || '';
                const credential = await cloud.authApi.signInWithEmailAndPassword(cloud.auth, AUTH_EMAILS[name], password);
                await finishAuthenticatedLogin(credential.user, name);
            } catch (error) {
                setAuthMessage(authErrorMessage(error));
                if (button) button.disabled = false;
            }
        };

        window.completeFirstUse = async function(event, name) {
            event.preventDefault();
            const button = $('#auth-submit');
            if (button) button.disabled = true;
            setAuthMessage('');
            try {
                const activationCode = String($('#activation-code')?.value || '').trim();
                const password = $('#auth-password')?.value || '';
                const confirmation = $('#auth-password-confirm')?.value || '';
                if (password !== confirmation) throw new Error('兩次輸入的密碼不一致。');
                await callBackend('claimFirstUse', { username: name, activationCode, password });
                const credential = await cloud.authApi.signInWithEmailAndPassword(cloud.auth, AUTH_EMAILS[name], password);
                await finishAuthenticatedLogin(credential.user, name);
                showToast(`${name}的登入密碼已設定`);
            } catch (error) {
                setAuthMessage(authErrorMessage(error));
                if (button) button.disabled = false;
            }
        };

                        </div>
                        <form id="branch-form" onsubmit="saveBranch(event,'${branch}')">
                            <div class="modal-body">
                                ${ticketAmountInput(data.ticket, Boolean(data.cannotCheckout))}
                                ${amountInput('amount-bills', '紙鈔收入', data.bills)}
                                ${amountInput('amount-coins', '硬幣收入', data.coins)}
                                ${amountInput('amount-coin-transfer', '零錢劃撥', data.coinTransfer)}
                                <div class="calculation-panel single-calculation" aria-live="polite">
                                    <div class="calc-item"><span class="calc-label">現金合計</span><strong id="preview-cash-total" class="calc-value">NT$ 0</strong></div>
                                </div>
                                <div class="expense-list">
                                    ${expenseInput(1, data.pettyItem1, pettyValues[0])}
                                    ${expenseInput(2, data.pettyItem2, pettyValues[1])}
                                    ${expenseInput(3, data.pettyItem3, pettyValues[2])}
                                </div>
                                <div class="calculation-panel three-column" aria-live="polite">
                                    <div class="calc-item"><span class="calc-label">零用金支出</span><strong id="preview-petty-total" class="calc-value">NT$ 0</strong></div>
                                    <div class="calc-item"><span class="calc-label">實際收入</span><strong id="preview-actual-income" class="calc-value">NT$ 0</strong></div>
                                    <div id="preview-diff-card" class="calc-item"><span class="calc-label">正負差額</span><strong id="preview-diff" class="calc-value">NT$ 0</strong></div>
                                </div>
                                <p class="touch-hint">📱 點選金額欄位後，手機與 iPad 會自動開啟數字鍵盤。</p>
                            </div>
                            <div class="modal-actions">
                                <button class="secondary-button" type="button" onclick="closeModal()">取消</button>
                                <button class="primary-button" type="submit">💾 儲存金額</button>
                            </div>
                        </form>
                    </section>
                </div>`;
            document.querySelectorAll('[data-branch-input]').forEach((input) => {
                input.addEventListener('input', () => { branchDirty = true; updateBranchPreview(); });
            });
            document.querySelectorAll('[data-money-input]').forEach((input) => {
                input.addEventListener('focus', () => input.select());
                input.addEventListener('wheel', (event) => {
                    if (event.ctrlKey) return;
                    const scroller = input.closest('.modal-card');
                    const multiplier = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? (scroller?.clientHeight || 1) : 1;
                    if (document.activeElement === input) input.blur();
                    if (scroller) scroller.scrollTop += event.deltaY * multiplier;
                    event.preventDefault();
                }, { passive: false });
            });
            updateBranchPreview();
            setTimeout(() => $('#amount-ticket')?.focus(), 50);
        };

        function formAmount(id) { return amount($(id)?.value); }
        function formText(id) { return String($(id)?.value || '').trim(); }

        function formPettyTotal() {
            return [1, 2, 3].reduce((total, index) => total + formAmount(`#amount-petty-${index}`), 0);
        }

        function updateBranchPreview() {
            const cashTotal = formAmount('#amount-bills') + formAmount('#amount-coins') + formAmount('#amount-coin-transfer');
            const petty = formPettyTotal();
            const actualIncome = cashTotal + petty;
            const diff = actualIncome - formAmount('#amount-ticket');
            const cashTotalEl = $('#preview-cash-total');
            const pettyTotalEl = $('#preview-petty-total');
            const actualIncomeEl = $('#preview-actual-income');
            const diffEl = $('#preview-diff');
            const diffCard = $('#preview-diff-card');
            if (cashTotalEl) cashTotalEl.textContent = `NT$ ${money(cashTotal)}`;
            if (pettyTotalEl) pettyTotalEl.textContent = `NT$ ${money(petty)}`;
            if (actualIncomeEl) actualIncomeEl.textContent = `NT$ ${money(actualIncome)}`;
            if (diffEl) {
                diffEl.textContent = `NT$ ${money(diff)}`;
                diffEl.style.color = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'var(--navy)';
            }
            if (diffCard) {
                diffCard.classList.toggle('diff-positive', diff > 0);
                diffCard.classList.toggle('diff-negative', diff < 0);
            }
        }

        window.saveBranch = function(event, branch) {
            event.preventDefault();
            if (!currentSelection) return;
            const record = getRecord(currentSelection.year, currentSelection.month, currentSelection.slot, true);
            const petty1 = formAmount('#amount-petty-1');
            const petty2 = formAmount('#amount-petty-2');
            const petty3 = formAmount('#amount-petty-3');
            record.branches[branch] = {
                ticket: formAmount('#amount-ticket'),
                bills: formAmount('#amount-bills'),
                coins: formAmount('#amount-coins'),
                coinTransfer: formAmount('#amount-coin-transfer'),
                petty: petty1 + petty2 + petty3,
                petty1,
                petty2,
                petty3,
                pettyItem1: formText('#petty-item-1'),
                pettyItem2: formText('#petty-item-2'),
                pettyItem3: formText('#petty-item-3'),
                cannotCheckout: Boolean($('#cannot-checkout')?.checked),
                saved: true,
                updatedAt: isoNow()
            };
            record.updatedAt = isoNow();
            branchDirty = false;
            touchAndSave();
            closeModal(true);
            renderSummary();
            showToast(`${branch}分店金額已儲存`);
        };

        window.closeModal = function(force = false) {
            if (!force && branchDirty && modalRoot.innerHTML && !confirm('尚未儲存輸入內容，確定要離開嗎？')) return;
            branchDirty = false;
            modalRoot.innerHTML = '';
        };

        function touchAndSave() {
            userData.collectionName = COLLECTION_NAME;
            userData.profile = username;
            userData.updatedAt = isoNow();
            saveLocalData();
            saveCloudData();
        }

        async function saveCloudData() {
            if (!cloud || !username) return;
            connectionStatus = 'saving';
            updateConnectionBadges();
            try {
                await cloud.setDoc(cloud.profileRef(), structuredClone(userData));
                connectionStatus = 'online';
            } catch (error) {
                console.warn('Accounting cloud save failed', error);
                connectionStatus = 'offline';
            }
            updateConnectionBadges();
        }

        async function attachProfileListener() {
            if (unsubscribeProfile) unsubscribeProfile();
            unsubscribeProfile = null;
            if (!cloud || !username) return;
            const profileName = username;
            let firstSnapshot = true;
            unsubscribeProfile = cloud.onSnapshot(cloud.profileRef(), async (snapshot) => {
                if (username !== profileName) return;
                if (!snapshot.exists()) {
                    if (firstSnapshot) await saveCloudData();
                    firstSnapshot = false;
                    return;
                }
                const remote = normalizeUserData(snapshot.data(), profileName);
                if (firstSnapshot && Date.parse(userData.updatedAt || 0) > Date.parse(remote.updatedAt || 0)) {
                    firstSnapshot = false;
                    await saveCloudData();
                    return;
                }
                firstSnapshot = false;
                userData = remote;
                saveLocalData();
                if (!modalRoot.innerHTML) {
                    if (currentView === 'calendar') renderCalendar();
                    if (currentView === 'summary') renderSummary();
                }
            }, (error) => {
                console.warn('Accounting cloud listener failed', error);
                connectionStatus = 'offline';
                updateConnectionBadges();
            });
        }

        async function initCloud() {
            try {
                const [{ initializeApp }, authApi, firestoreApi, functionsApi] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js'),
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js'),
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-functions.js')
                ]);
                const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
                const firebaseApp = initializeApp(actualConfig, APP_NAMESPACE);
                const auth = authApi.initializeAuth(firebaseApp, {
                    persistence: [
                        authApi.indexedDBLocalPersistence,
                        authApi.browserLocalPersistence,
                        authApi.browserSessionPersistence,
                        authApi.inMemoryPersistence
                    ]
                });
                const db = firestoreApi.getFirestore(firebaseApp);
                const functions = functionsApi.getFunctions(firebaseApp, 'us-central1');
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await authApi.signInWithCustomToken(auth, __initial_auth_token);
                }
                cloud = {
                    auth,
                    authApi,
                    functions,
                    functionsApi,
                    setDoc: firestoreApi.setDoc,
                    onSnapshot: firestoreApi.onSnapshot,
                    profileRef: () => firestoreApi.doc(db, 'artifacts', APP_NAMESPACE, 'public', 'data', PROFILE_COLLECTION, username)
                };
                connectionStatus = 'online';
                updateConnectionBadges();
                authApi.onAuthStateChanged(auth, async (user) => {
                    if (!user) return;
                    if (user.isAnonymous) { await authApi.signOut(auth); return; }
                    try {
                        const token = await user.getIdTokenResult();
                        const isAdmin = token.claims.admin === true || token.claims.role === 'admin';
                        const profile = String(token.claims.profile || '');
                        authState = { uid: user.uid, role: isAdmin ? 'admin' : 'staff', profile: isAdmin ? 'Nick' : profile };
                        if (currentView === 'login' && !modalRoot.innerHTML) {
                            if (isAdmin) renderAdmin();
                            else if (profiles[profile]) enterProfile(profile);
                        }
                    } catch (error) {
                        console.warn('Accounting auth restore failed', error);
                    }
                });
                if (username && auth.currentUser) attachProfileListener();
            } catch (error) {
                console.warn('Accounting is using local storage', error);
                connectionStatus = 'offline';
                updateConnectionBadges();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modalRoot.innerHTML) window.closeModal();
        });

        renderLogin();
        initCloud();
    </script>
</body>
</html>
